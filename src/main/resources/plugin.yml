name: TPM
version: 1.1.0
main: com.roostergroup.tpm.TPM
api-version: 1.21
softdepend: [Vault]

commands:
  tpm:
    description: TPM 主命令
    usage: /<command> <子命令> ...
  suicide:
    description: 自杀
    usage: /suicide

permissions:
  tpm.reload:
    description: 允许重载插件
    default: op